name: Download etcd Docker Image
on:
  workflow_dispatch: # cho phép nhấn nút chạy thủ công

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Pull and Save Docker Image
        run: |
          docker pull quay.io/coreos/etcd:v3.7.3
          docker save quay.io/coreos/etcd:v3.7.3 -o etcd.tar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: etcd-image # tên file khi tải
          path: etcd.tar
          retention-days: 1 # tự xóa file sau 1 ngày